name: Quit lifecycle canonical PTY verification
on: [push, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  pty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        go: ['1.26.0', '1.27.1']
        source: [original, fixed]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source == 'original' && '96d69d2f7eb182bb311be08fc56ed2c208239aff' || 'fbe2607009556aa7a7c1abe4efc32211d8a74388' }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
      - name: Record source and compare inherited versus controlling PTY
        run: |
          mkdir artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          go version > artifacts/go-version.txt
          git hash-object --path=tea.go tea.go > artifacts/production-before.blob
          if [ '${{ matrix.source }}' = fixed ]; then
            test "$(cat artifacts/source-sha.txt)" = fbe2607009556aa7a7c1abe4efc32211d8a74388
            test "$(cat artifacts/production-before.blob)" = 3184ae16b131c090295d4e842a492ea0cdbc6539
            git hash-object --path=quit_lifecycle_test.go quit_lifecycle_test.go > artifacts/test-before.blob
            test "$(cat artifacts/test-before.blob)" = 287a36b145af5c109c52e7d49b51122a2533cf3f
            sha256sum tea.go quit_lifecycle_test.go > artifacts/source-before.sha256
          else
            test "$(cat artifacts/source-sha.txt)" = 96d69d2f7eb182bb311be08fc56ed2c208239aff
            test "$(cat artifacts/production-before.blob)" = ea9e216fca365ef31063e0c672ea6d0e0e46357e
            sha256sum tea.go > artifacts/source-before.sha256
          fi
          git diff --exit-code HEAD --
          git status --porcelain --untracked-files=no > artifacts/tracked-status-before.txt
          test ! -s artifacts/tracked-status-before.txt
          git show '${{ github.sha }}:.github/native/quit-probe.go' > artifacts/quit-probe.go
          git show '${{ github.sha }}:.github/native/quit-pty.py' > artifacts/quit-pty.py
          go build -race -o artifacts/quit-probe artifacts/quit-probe.go
          expectation=fixed
          if [ '${{ matrix.source }}' = original ]; then expectation=baseline-running; fi
          set +e
          python3 artifacts/quit-pty.py "$PWD/artifacts/quit-probe" "$expectation" artifacts/pty-inherited > artifacts/pty-inherited.log 2>&1
          echo $? > artifacts/pty-inherited.exit
          python3 artifacts/quit-pty.py "$PWD/artifacts/quit-probe" "$expectation" artifacts/pty-controlling controlling > artifacts/pty-controlling.log 2>&1
          echo $? > artifacts/pty-controlling.exit
          set -e
          sha256sum -c artifacts/source-before.sha256 > artifacts/source-after-check.log
          git hash-object --path=tea.go tea.go > artifacts/production-after.blob
          cmp artifacts/production-before.blob artifacts/production-after.blob
          if [ '${{ matrix.source }}' = fixed ]; then
            git hash-object --path=quit_lifecycle_test.go quit_lifecycle_test.go > artifacts/test-after.blob
            cmp artifacts/test-before.blob artifacts/test-after.blob
          fi
          git rev-parse HEAD > artifacts/source-after-sha.txt
          cmp artifacts/source-sha.txt artifacts/source-after-sha.txt
          git diff --exit-code HEAD -- > artifacts/tracked-diff-after.patch
          git status --porcelain --untracked-files=no > artifacts/tracked-status-after.txt
          test ! -s artifacts/tracked-status-after.txt
          test "$(cat artifacts/pty-controlling.exit)" = 0
          test "$(cat artifacts/pty-inherited.exit)" = 0
      - name: Hash diagnostic evidence
        if: always()
        run: |
          find artifacts -type f ! -name SHA256SUMS ! -name quit-probe -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quit-final-pty-${{ matrix.os }}-${{ matrix.source }}-${{ matrix.go }}
          path: |
            artifacts/
            !artifacts/quit-probe

